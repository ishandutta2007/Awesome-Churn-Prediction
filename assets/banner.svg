<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.0"/>
    </linearGradient>
    
    <style>
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }
      @keyframes pulse {
        0% { opacity: 0.3; }
        50% { opacity: 0.8; }
        100% { opacity: 0.3; }
      }
      @keyframes dash {
        to { stroke-dashoffset: -40; }
      }
      .floating { animation: float 6s ease-in-out infinite; }
      .pulsing { animation: pulse 3s ease-in-out infinite; }
      .wave-line { stroke-dasharray: 8 4; animation: dash 2s linear infinite; }
      .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; fill: #ffffff; }
      .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; fill: #cbd5e1; }
      .pill-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; fill: #e2e8f0; font-size: 13px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>
  
  <!-- Subtle Grid Lines (Dynamic/Background) -->
  <g opacity="0.15">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200" stroke="#94a3b8" stroke-width="1"/>
    <path d="M200 0 V320 M400 0 V320 M600 0 V320 M800 0 V320 M1000 0 V320" stroke="#94a3b8" stroke-width="1"/>
  </g>

  <!-- Background Animated Graphics (Low opacity behind text) -->
  <!-- Retention Curve Graph (Background Right) -->
  <g transform="translate(750, 40)" opacity="0.35" class="floating">
    <rect x="0" y="0" width="380" height="220" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <path d="M 30 170 Q 100 40, 200 130 T 350 70" fill="none" stroke="url(#accent)" stroke-width="4"/>
    <path d="M 30 170 Q 100 40, 200 130 T 350 70 L 350 190 L 30 190 Z" fill="url(#glow)"/>
    <circle cx="200" cy="130" r="6" fill="#f472b6" class="pulsing"/>
    <circle cx="350" cy="70" r="6" fill="#38bdf8" class="pulsing"/>
  </g>

  <!-- Dynamic Wave Lines -->
  <path d="M -50 260 Q 300 200, 600 270 T 1250 220" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.3" class="wave-line"/>
  <path d="M -50 280 Q 350 220, 700 290 T 1250 240" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.2" class="wave-line"/>

  <!-- FOREGROUND CONTENT (Ensured high contrast and readabilty) -->
  <g transform="translate(60, 0)">
    <!-- Main Title -->
    <text x="0" y="115" class="title" font-size="46" letter-spacing="-0.5">Awesome Churn Prediction 🚀</text>
    
    <!-- Subtitle -->
    <text x="0" y="158" class="subtitle" font-size="20">Curated SaaS Platforms, Open-Source Repos &amp; Retention Analytics Ecosystem</text>
    <text x="0" y="188" class="subtitle" font-size="15" fill="#94a3b8" opacity="0.9">Customer Success • Health Scoring • Revenue Forecasting • Behavioral Cohorts</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 225)">
      <!-- Pill 1 -->
      <g transform="translate(0,0)">
        <rect x="0" y="0" width="160" height="34" rx="17" fill="#334155" stroke="#64748b" stroke-width="1"/>
        <circle cx="18" cy="17" r="6" fill="#10b981"/>
        <text x="32" y="22" class="pill-text">SaaS Platforms</text>
      </g>
      
      <!-- Pill 2 -->
      <g transform="translate(172,0)">
        <rect x="0" y="0" width="175" height="34" rx="17" fill="#334155" stroke="#64748b" stroke-width="1"/>
        <circle cx="18" cy="17" r="6" fill="#6366f1"/>
        <text x="32" y="22" class="pill-text">Open-Source Solutions</text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(359,0)">
        <rect x="0" y="0" width="160" height="34" rx="17" fill="#334155" stroke="#64748b" stroke-width="1"/>
        <circle cx="18" cy="17" r="6" fill="#f59e0b"/>
        <text x="32" y="22" class="pill-text">Health Scoring</text>
      </g>
    </g>
  </g>
</svg>
